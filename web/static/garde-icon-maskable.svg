<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Gardetänzerin</title>
  <desc id="beschreibung">Schwarze Silhouette einer Gardetänzerin mit Gardehut vor rotem Grund</desc>

  <!-- Variante "maskable" für die PWA-Icons (manifest.webmanifest):
       volles Quadrat ohne Eckrundung, Figur auf 0.84 verkleinert und
       mit ihrer Mitten auf die Mitte (256/256) gesetzt, damit alles
       innerhalb der maskierbaren Sicherheitszone (Kreis ⌀ 80 %) bleibt.
       Pfaddaten identisch mit garde-icon.svg – dort ist die Master-Version. -->
  <rect width="512" height="512" fill="#c8102e"/>

  <g transform="translate(256 256) scale(0.84) translate(-278.75 -235.25)"
     fill="#0d0d0f" stroke="#0d0d0f" stroke-linecap="round" stroke-linejoin="round">

    <!-- Spielbein: Arabeske, tritt seitlich unter dem Rock hervor -->
    <path d="M282 294 C322 282 360 258 390 222" fill="none" stroke-width="30"/>
    <path d="M386 226 C396 214 404 204 412 192" fill="none" stroke-width="18"/>

    <!-- Standbein, Fuß en pointe -->
    <path d="M256 290 C248 330 246 372 252 410" fill="none" stroke-width="32"/>
    <path d="M252 404 C254 420 258 432 264 442" fill="none" stroke-width="17"/>

    <!-- Rock: nach rechts aufgeworft, gewellter Saum -->
    <path d="M232 248 C250 238 272 236 288 244 C322 256 350 272 366 294
             C348 312 330 318 312 314 C300 324 276 328 258 324 C236 332 208 330 188 320
             C164 318 146 306 140 292 C158 266 192 252 232 248 Z" stroke="none"/>

    <!-- Leibchen, schlanke Taille -->
    <path d="M226 168 C246 158 270 158 286 170 C282 202 278 232 276 262 L240 262
             C236 232 230 202 226 168 Z" stroke="none"/>

    <!-- Hals, Kopf, Dtype -->
    <path d="M246 152 L252 174" fill="none" stroke-width="21"/>
    <circle cx="250" cy="130" r="30" stroke="none"/>

    <!-- Gardehut: sitzt auf dem Kopf, Krempe, Korb, Busch nach hinten -->
    <ellipse cx="248" cy="106" rx="46" ry="16" transform="rotate(-14 248 106)" stroke="none"/>
    <path d="M222 108 C224 80 235 66 249 66 C263 66 273 84 272 108 Z" stroke="none"/>
    <path d="M252 76 C238 64 222 46 214 20 C230 40 244 58 258 70 Z" stroke="none"/>

    <!-- Arme: einer lang seitlich, einer hoch über den Kopf -->
    <path d="M222 176 C198 172 174 162 158 144" fill="none" stroke-width="22"/>
    <path d="M160 146 C152 136 146 126 144 112" fill="none" stroke-width="15"/>
    <path d="M290 178 C318 150 328 100 306 58" fill="none" stroke-width="22"/>
  </g>
</svg>
