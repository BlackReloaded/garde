{{define "base"}}
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a2c">
<link rel="manifest" href="/static/manifest.webmanifest">
<!-- Icon: Favicon (SVG, mit PNG-Fallback für Safari/iOS),
     Quelle web/static/garde-icon.svg; das PNG ist die quadratische
     Version ohne Eckrundung (wie garde-icon-maskable.svg), weil iOS
     transparente Icon-Hintergründe schwarz füllt. -->
<link rel="icon" type="image/svg+xml" href="/static/garde-icon.svg">
<link rel="icon" type="image/png" href="/static/garde-icon.png">
<link rel="apple-touch-icon" href="/static/garde-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gardetanzturnier">
<title>Gardetanzturnier</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx.min.js" defer></script>
<script>
// Lokale Uhr + Fokus-Verwaltung für die Punkteeingabe.
// Listener hängen an document (nicht body): Bei Vollseitenswaps (Disziplin-
// Wechsel) bleibt document erhalten, der Body-Inhalt wird ersetzt.
(function () {
  var drafts = {}; // "teilnehmerID|richter" -> noch nicht abgeschickter Wert
  // True auf Touch-Geräten (iPhone/iPad): steuert Autofokus und Scrollen.
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

  function judgeKey(input) {
    var form = input.closest ? input.closest('form') : null;
    if (!form) return null;
    var pid = form.querySelector('input[name=participant_id]');
    var j = form.querySelector('input[name=judge]');
    return pid && j ? pid.value + '|' + j.value : null;
  }

  function focusNextJudge() {
    var panel = document.getElementById('scorepanel');
    if (!panel) return;
    var inputs = Array.from(panel.querySelectorAll('input[type=number]'));
    for (var i = 0; i < inputs.length; i++) {
      if (!inputs[i].value) {
        inputs[i].focus();
        // Touch: Feld über der Tastatur sichtbar halten.
        if (coarse && inputs[i].scrollIntoView) {
          inputs[i].scrollIntoView({ block: 'center' });
        }
        return;
      }
    }
  }

  // Noch nicht abgeschickte Werte nach einem Panel-Neuraster wieder einpflegen
  // (z. B. wenn ein anderes Feld vor dem Abspeichern des ersten bearbeitet
  // wurde). Gespeicherte Werte (Serverwert vorhanden) werden nicht überschrieben.
  function restoreDrafts() {
    var panel = document.getElementById('scorepanel');
    if (!panel) return;
    panel.querySelectorAll('input[name=value]').forEach(function (inp) {
      var key = judgeKey(inp);
      if (key === null) return;
      var d = drafts[key];
      if (d === undefined) return;
      if (inp.value === '') inp.value = d;
      else delete drafts[key];
    });
  }

  // Eingaben im Panel pro Teilnehmer+Richter merken.
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (!t || t.name !== 'value' || !t.closest || !t.closest('#scorepanel')) return;
    var key = judgeKey(t);
    if (key === null) return;
    if (t.value === '') delete drafts[key];
    else drafts[key] = t.value;
  });

  // Nach jedem Request: (ggf.) Drafts wiederherstellen; nach /score das
  // nächste freie Richter-Feld fokussieren.
  document.addEventListener('htmx:afterRequest', function (e) {
    var cfg = e.detail && e.detail.requestConfig;
    var path = cfg ? cfg.path : '';
    restoreDrafts();
    if (path.indexOf('/score') >= 0) { setTimeout(focusNextJudge, 80); }
  });

  // Läuft bei einem View-Wechsel (z. B. Disziplin) noch ein Request an
  // /partials/refresh der alten Ansicht, wird er abgebrochen – sonst würde
  // seine Antwort die neue Ansicht temporär mit alten Daten überschreiben.
  var inflight = new WeakMap(); // Element -> xhr (nur Refresh-Requests)
  document.addEventListener('htmx:beforeRequest', function (e) {
    var elt = e.target;
    if (elt && elt.getAttribute &&
        (elt.getAttribute('hx-get') || '').indexOf('/partials/refresh') === 0) {
      inflight.set(elt, e.detail && e.detail.xhr);
    }
  });
  document.addEventListener('htmx:beforeCleanupElement', function (e) {
    var t = e.target;
    if (!t || typeof t !== 'object') return;
    var xhr = inflight.get(t);
    if (xhr) { inflight.delete(t); try { xhr.abort(); } catch (_) {} }
  });

  // ---------- Touch (iPhone/iPad): Punkteeingabe über die Zahlentastatur ----------
  // Auf iOS schließt ein Formular-Submit durch Enter die Tastatur, und ein
  // focus() außerhalb der Drückgeste öffnet sie nicht wieder. Deshalb hier
  // (nur Touch) kein Submit: Enter abfangen, den Fokus noch IN der Geste
  // ins nächste freie Feld legen (Tastatur bleibt offen und wandert mit)
  // und die Note per fetch senden. Die Antwort aktualisiert Rangliste,
  // Statistik und Zeitplan sofort; das Eingabe-Panel wird nur neu gebaut,
  // wenn es sich strukturell ändert (letzte Richter-Note bzw. offizielle
  // Summe) – bei jeder Note ersetzt, wäre die Tastatur nach jedem Enter zu.
  // Der Desktop behält den bisherigen Formular-Submit-Weg.
  if (coarse) {
    function focusField(el) {
      if (!el) return;
      el.focus();
      if (el.scrollIntoView) el.scrollIntoView({ block: 'center' });
    }

    function nextFreeField(panel, except) {
      var inputs = panel.querySelectorAll('input[type=number]');
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i] !== except && inputs[i].value === '') return inputs[i];
      }
      return null;
    }

    // OOB-Antwort von /score manuell einsetzen (statt HTMX-Swap), damit das
    // Score-Panel bei laufenden Eingaben ausgelassen werden kann: Sein
    // innerHTML wäre sonst das fokussierte Feld – würde es mit dem Panel
    // ausgetauscht, fällt der Fokus auf <body> und die Tastatur schließt.
    function applyScoreReply(html, swapPanel) {
      var tpl = document.createElement('template');
      tpl.innerHTML = html;
      var blocks = tpl.content.querySelectorAll('[hx-swap-oob]');
      for (var i = 0; i < blocks.length; i++) {
        var block = blocks[i];
        var cur = document.getElementById(block.id);
        if (!cur || !block.innerHTML) continue;
        if (block.id === 'scorepanel') {
          if (!swapPanel) continue;
          // Panel-Element komplett ersetzen: der MutationObserver unten
          // erkennt den Wechsel und zielt danach aufs erste freie Feld.
          var fresh = document.createElement('div');
          fresh.id = 'scorepanel';
          fresh.innerHTML = block.innerHTML;
          if (window.htmx && htmx.process) htmx.process(fresh);
          cur.replaceWith(fresh);
        } else {
          cur.innerHTML = block.innerHTML;
        }
      }
      updateEdgeHints();
    }

    function sendScore(form, swapPanel, mark) {
      var body = new URLSearchParams();
      var inputs = form.querySelectorAll('input');
      for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].name) body.set(inputs[i].name, inputs[i].value);
      }
      fetch('/score', {
        method: 'POST',
        headers: { 'HX-Request': 'true' },
        body: body,
      }).then(function (res) {
        var redir = res.headers.get('HX-Redirect');
        if (redir) { window.location = redir; return null; } // Session abgelaufen
        if (!res.ok) return null;
        return res.text();
      }).then(function (html) {
        if (!html) return;
        applyScoreReply(html, swapPanel);
        if (mark && document.contains(mark)) {
          // Referenzwert für den "nichts geändert"-Test im focusout-Pfad
          // (der Zeitstempel der Note steuert die ETA – nicht unnötig
          // neu setzen) und aufgeräumter Draft.
          mark.dataset.sent = mark.value;
          var dk = judgeKey(mark);
          if (dk !== null) delete drafts[dk];
          // Grüne "filled"-Markierung: Am Desktop bringt sie der Server mit
          // dem Panel-Neubau, auf Touch bleibt das Feld stehen – hier also
          // erst NACH erfolgreicher Antwort selbst setzen (löschen = leeren).
          // Bei getauschtem Panel kommt sie vom Server – nicht nachtragen.
          if (!swapPanel) {
            if (mark.value === '') mark.classList.remove('filled');
            else mark.classList.add('filled');
          }
        }
      })['catch'](function () {});
    }

    function commitScoreField(inp, panel, form, moveFocus) {
      if (moveFocus === undefined) moveFocus = true;
      // Leeres, nie gefülltes Feld: nichts zu löschen – nur weiterspringen.
      if (inp.value === '' && !inp.classList.contains('filled')) {
        if (moveFocus) focusField(nextFreeField(panel, inp));
        return;
      }
      // Panel-Neubau nur bei strukturellem Wechsel: offizielle Summe, oder
      // die Note, die alle Richter komplett macht (→ Summenzeile bzw.
      // nächster Teilnehmer). Sonst bleiben Fokus und Tastatur im alten Panel.
      var swapPanel = inp.name === 'total_override';
      if (!swapPanel) {
        swapPanel = true;
        var fields = panel.querySelectorAll('.judges input[type=number]');
        for (var i = 0; i < fields.length; i++) {
          if (fields[i] !== inp && fields[i].value === '') {
            swapPanel = false;
            break;
          }
        }
      }
      if (moveFocus && !swapPanel) focusField(nextFreeField(panel, inp));
      sendScore(form, swapPanel, inp);
    }

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.keyCode !== 13) return;
      var inp = e.target;
      if (!inp || !inp.matches ||
          !inp.matches('#scorepanel input[type=number]')) return;
      var panel = document.getElementById('scorepanel');
      var form = inp.closest ? inp.closest('form') : null;
      if (!panel || !form || !panel.contains(form)) return;
      // Kein Formular-Submit: das würde auf iOS die Tastatur schließen.
      e.preventDefault();
      inp.dataset.busy = String(Date.now());
      commitScoreField(inp, panel, form);
    });

    // Sicherheitsnetz: reicht ein iOS die Enter-Taste trotzdem als Submit
    // durch (Sonderverhalten), wird die Formular-Abgabe gestoppt – im
    // keydown-Pfad wurde die Note schon gesendet; das Zeitstempel-Fenster
    // verhindert die Doppelsendung. Im capture-Durchlauf, damit das
    // preventDefault vor HTMX' eigenem Submit-Handler am Formular ankommt
    // (HTMX würde sonst trotzdem seinen XHR starten).
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (!form.closest || !form.closest('#scorepanel')) return;
      if (form.getAttribute('hx-post') !== '/score') return;
      e.preventDefault(); // echtes Submit schließt auf iOS die Tastatur
      var inp = document.activeElement;
      if (!inp || !inp.matches ||
          !inp.matches('#scorepanel input[type=number]')) return;
      if (inp.dataset.busy &&
          Date.now() - Number(inp.dataset.busy) < 500) return;
      var panel = document.getElementById('scorepanel');
      var f = inp.closest('form');
      if (panel && f) commitScoreField(inp, panel, f);
    }, true);

    // Geräte-Realität: Auf der iPhone-Zahlentastatur gibt es GAR KEINE
    // Enter-Taste, und die „Weiter"-Taste über der Tastatur verschiebt nur
    // den Fokus (kein Keydown, kein Submit) – über keydown/submit kommt auf
    // dem iPhone also nie etwas an. Deshalb gilt auf Touch zusätzlich:
    // Verlassen des Feldes mit geändertem Wert = Speichern (wie Enter am
    // Desktop). Deckt „Weiter", Antippen des nächsten Feldes und
    // Tastatur-Schließen ab. Der busy-Fenster-Test verhindert die
    // Doppelsendung, wenn vorhin schon per Enter/Submit kommitiert wurde.
    document.addEventListener('focusout', function (e) {
      var inp = e.target;
      if (!inp || !inp.matches ||
          !inp.matches('#scorepanel input[type=number]')) return;
      if (inp.dataset.busy &&
          Date.now() - Number(inp.dataset.busy) < 600) return;
      var base = inp.dataset.sent;
      if (base === undefined) base = inp.defaultValue;
      if (inp.value === base) return; // nichts geändert – nichts schicken
      var panel = document.getElementById('scorepanel');
      var form = inp.closest ? inp.closest('form') : null;
      if (!panel || !form || !panel.contains(form)) return;
      inp.dataset.busy = String(Date.now());
      commitScoreField(inp, panel, form, false);
    });
  }

  // Tabellen, die breiter sind als der Container, bekommen einen dezenten
  // Kanten-Fade, damit das horizontale Wischen auf Touch auffindbar ist.
  // Klassen via JS, damit der Fade nur bei echtem Overflow erscheint.
  // Zusätzlich: horizontale Scroll-Position merken. Die Polling- und
  // Score-Antworten bauen die Tabellen per OOB komplett neu; dabei entstehen
  // frische .table-wrap-Elemente, die bei scrollLeft 0 starten – auf dem
  // iPhone (zu den Punktespalten gewischt) wäre das bei jedem Reload ein
  // Sprung nach ganz links. Merke die Position pro Tabelle (Key:
  // Sektions-id + Index) und setze sie nach dem Swap wieder. Wischt der
  // Nutzer selbst zurück nach links (<=4 px), gilt das als Absicht und die
  // Merkposition verschwindet.
  var scrollMem = {};
  function wrapKey(w) {
    var host = w.closest ? w.closest('[id]') : null;
    var idx = 0;
    if (host) {
      var all = host.querySelectorAll('.table-wrap');
      for (var i = 0; i < all.length; i++) {
        if (all[i] === w) { idx = i; break; }
      }
    }
    return (host ? host.id : 'x') + '/' + idx;
  }
  function updateEdgeHints() {
    var wraps = document.querySelectorAll('.table-wrap');
    for (var i = 0; i < wraps.length; i++) {
      var w = wraps[i];
      if (!w.dataset.scrolled) {
        // Frisches Element nach einem Swap: gemerkte Position zurückholen.
        w.dataset.scrolled = '1';
        var mem = scrollMem[wrapKey(w)];
        if (mem) w.scrollLeft = mem;
      }
      var max = w.scrollWidth - w.clientWidth - 1;
      w.classList.toggle('edg-r', max > 8 && w.scrollLeft < max - 8);
      w.classList.toggle('edg-l', w.scrollLeft > 8);
    }
  }
  document.addEventListener('scroll', function (e) {
    var w = e.target;
    if (w && w.classList && w.classList.contains('table-wrap')) {
      var k = wrapKey(w);
      if (w.scrollLeft > 4) scrollMem[k] = w.scrollLeft;
      else delete scrollMem[k];
    }
    updateEdgeHints();
  }, true);
  window.addEventListener('resize', updateEdgeHints);
  // Nach Swaps Positionen wiederherstellen. OOB-Blöcke (Polling antwortet
  // mit hx-swap-oob) laufen über den oobAfterSwap-Pfad; der View-Wechsel
  // (Selektoren, Ziel body) löscht die Merkpositionen – neue Ansicht,
  // frische Ausgangslage.
  document.addEventListener('htmx:afterSwap', function (e) {
    if (e.detail && e.detail.target === document.body) scrollMem = {};
    updateEdgeHints();
  });
  document.addEventListener('htmx:oobAfterSwap', updateEdgeHints);

  function tick() {
    var c = document.getElementById('clock');
    if (!c) return;
    var t = new Date();
    c.textContent = [t.getHours(), t.getMinutes(), t.getSeconds()]
      .map(function (x) { return String(x).padStart(2, '0'); }).join(':');
  }

  document.addEventListener('DOMContentLoaded', function () {
    tick();
    setInterval(tick, 1000);
    // Auf Touch nicht auto-fokussieren: das würde die Tastatur aufklappen,
    // obwohl man evtl. nur die Live-Ansicht anschaut.
    if (!coarse) setTimeout(focusNextJudge, 300);
    updateEdgeHints();

    // iOS/Android: Klappt die Tastatur auf, kann das fokussierte Feld
    // darunter liegen – dann in die Mitte des sichtbaren Bereichs ziehen.
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        var el = document.activeElement;
        if (!el || !el.matches || !el.matches('input, select, textarea')) return;
        var vv = window.visualViewport;
        var r = el.getBoundingClientRect();
        if (r.bottom > vv.offsetTop + vv.height - 8 || r.top < vv.offsetTop) {
          el.scrollIntoView({ block: 'center' });
        }
      });
    }

    // Fokus nach Panel-Ersatz (View-Wechsel oder Teilnehmerwechsel):
    // Das fokussierte Eingabefeld liegt im alten DOM-Teil, den HTMX
    // ersetzt – ohne Zutun würde der Fokus auf <body> fallen. Sobald der
    // #scorepanel-Knoten durch einen Swap ersetzt wurde, legen wir den
    // Fokus auf das nächste freie Richter-Feld des neuen Panels.
    var panelEl = document.getElementById('scorepanel');
    new MutationObserver(function () {
      var cur = document.getElementById('scorepanel');
      if (cur && cur !== panelEl) {
        panelEl = cur;
        setTimeout(focusNextJudge, 80);
      }
    }).observe(document.body, { childList: true, subtree: true });
  });
})();
</script>
</head>
<body>
{{block "body" .}}{{end}}
</body>
</html>
{{end}}
